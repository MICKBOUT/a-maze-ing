[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mazegen"]

[project]
name = "mazegen"
version = "2.0.0"
authors = [
  { name="pdauga", email="pdauga@student.42lyon.fr" },
  { name="mboutte", email="mboutte@student.42lyon.fr" },
]

description = "None"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pillow>=12.3.0",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "snakeviz>=2.2.2",
    "mlx",
]

[tool.uv.sources]
mlx = {path = "lib/mlx-2.2-py3-none-any.whl" }

[project.urls]
"Homepage" = "https://projects.intra.42.fr/a-maze-ing/mboutte"

[[tool.mypy.overrides]]
module = "mlx"
ignore_missing_imports = true
